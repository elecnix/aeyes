name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # A failing leg must not cancel the others; the self-hosted Linux leg is
      # the one that carries CI while GitHub-hosted runners are unavailable.
      fail-fast: false
      matrix:
        # Linux runs on the self-hosted ARC runner pool (label `arc-runners`).
        # Windows and macOS need GitHub-hosted runners, which this account
        # cannot use at the moment, so those legs only run when the workflow is
        # dispatched by hand.
        os: [arc-runners, windows-latest, macos-latest]
    if: matrix.os == 'arc-runners' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev libclang-dev pkg-config v4l-utils
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Coverage
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --lib --ignore-tests --skip-clean --no-fail-fast --out xml
