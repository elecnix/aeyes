name: CDnet Evaluation

on:
  workflow_dispatch: {}  # manual triggering only

jobs:
  evaluate:
    # Self-hosted ARC runner pool (label `arc-runners`).
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests/cdnet_evaluation
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Cache CDnet archive
        uses: actions/cache@v4
        with:
          # Only the archive: the extracted frames and the raw/ cache are
          # rebuilt from it, and the whole data directory overflows the cache.
          path: tests/cdnet_evaluation/data/dataset2014.zip
          key: cdnet-dataset-v1
          restore-keys: |
            cdnet-dataset-
      - name: Fetch CDnet 2014 dataset
        run: scripts/download-cdnet.sh
      - name: Run CDnet evaluation
        env:
          CDNET_DOWNLOAD: 1
          CDNET_MAX_FRAMES: 0
          CDNET_PRECONVERT: 1
        run: |
          cargo run --release --bin cdnet-evaluation
        timeout-minutes: 180
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: cdnet-report-${{ github.run_number }}
          path: |
            tests/cdnet_evaluation/results/cdnet_report.json
            tests/cdnet_evaluation/results/*.log
