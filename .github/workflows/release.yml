name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish'
        required: true

jobs:
  publish:
    # Self-hosted ARC runner pool (label `arc-runners`); it is the only Linux
    # capacity this account can use while GitHub-hosted runners are blocked.
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev libclang-dev pkg-config v4l-utils
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
